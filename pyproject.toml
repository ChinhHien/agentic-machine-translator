[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyglot-lc"
version = "0.1.0"
description = "Long-context multi-agent machine translation CLI with reasoning bank and skill optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Polyglot LC" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "markdown-it-py>=3.0",
    "tiktoken>=0.7",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "chromadb>=0.5",
    "openai>=1.30,<2",
    "tenacity>=8.3",
    "loguru>=0.7",
    "langdetect>=1.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "pytest-timeout>=2.3",
]

[project.scripts]
polyglot = "polyglot_lc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/polyglot_lc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 120
# The `webui` app lives at the repo root, which the editable install does not
# put on sys.path (it exposes `<root>/src` only), so tests could not import it.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The codebase annotates every deliberate blanket ``except Exception`` with
# ``# noqa: BLE001`` and a reason. Enabling the rule makes those annotations
# meaningful instead of "unused noqa" noise, and keeps new ones honest.
extend-select = ["BLE001"]
